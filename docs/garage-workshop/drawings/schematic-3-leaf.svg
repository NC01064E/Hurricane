<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1087 652" width="1087" height="652" font-family="Helvetica,Arial,sans-serif" role="img" aria-label="Corrected leaf construction"><rect width="1087" height="652" fill="#fff"/><text x="30.0" y="34.0" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke">SCHEMATIC 3 - GATE LEAF CONSTRUCTION (pair is mirrored)</text><text x="30.0" y="52.0" font-size="11" fill="#666" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">Leaf A shown from the ROOM face: hinge stile left, meeting stile right. Stiles are DOUBLED 2x4 on edge (3" wide x 3.5" deep).</text><rect x="70.0" y="90.0" width="217.1" height="414.1" fill="none" stroke="#1b1b1b" stroke-width="2" rx="0"/><rect x="70.0" y="90.0" width="15.6" height="414.1" fill="#e8dcc8" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="271.5" y="90.0" width="15.6" height="414.1" fill="#e8dcc8" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="85.6" y="90.0" width="185.9" height="7.8" fill="#e8dcc8" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="85.6" y="302.6" width="185.9" height="7.8" fill="#e8dcc8" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="85.6" y="496.2" width="185.9" height="7.8" fill="#e8dcc8" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="174.7" y="97.8" width="7.8" height="398.4" fill="#e8dcc8" stroke="#1b1b1b" stroke-width="1" rx="0"/><line x1="85.6" y1="496.2" x2="271.5" y2="97.8" stroke="#0b5cab" stroke-width="5"/><text x="321.1" y="339.6" font-size="9" fill="#0b5cab" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">Z-brace: low on hinge side,</text><text x="321.1" y="351.6" font-size="9" fill="#0b5cab" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">high on meeting side (compression)</text><rect x="65.8" y="119.4" width="7.2" height="14.0" fill="#0b5cab" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="65.8" y="233.2" width="7.2" height="14.0" fill="#0b5cab" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="65.8" y="346.9" width="7.2" height="14.0" fill="#0b5cab" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="65.8" y="460.7" width="7.2" height="14.0" fill="#0b5cab" stroke="#1b1b1b" stroke-width="1" rx="0"/><text x="62.0" y="297.0" font-size="9" fill="#0b5cab" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke" transform="rotate(-90 62.0 297.0)">4 NRP hinges, 3" screws into doubled jamb</text><circle cx="255.9" cy="472.9" r="11.0" fill="#fff" stroke="#0b5cab" stroke-width="2"/><text x="321.1" y="476.9" font-size="9" fill="#0b5cab" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">gate wheel at meeting corner</text><rect x="275.7" y="279.6" width="22.0" height="38.0" fill="#0b5cab" stroke="#1b1b1b" stroke-width="1" rx="0"/><text x="321.1" y="291.6" font-size="9" fill="#0b5cab" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">rim deadbolt @ 38" (leaf A)</text><text x="321.1" y="121.2" font-size="9" fill="#0b5cab" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">top + bottom barrel bolts, room face</text><line x1="70.0" y1="532.0" x2="287.1" y2="532.0" stroke="#666" stroke-width="1"/><line x1="70.0" y1="528.0" x2="70.0" y2="536.0" stroke="#666" stroke-width="1"/><line x1="287.1" y1="528.0" x2="287.1" y2="536.0" stroke="#666" stroke-width="1"/><text x="178.6" y="527.0" font-size="11" fill="#666" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">41.75" per leaf</text><line x1="30.0" y1="90.0" x2="30.0" y2="504.1" stroke="#666" stroke-width="1"/><line x1="26.0" y1="90.0" x2="34.0" y2="90.0" stroke="#666" stroke-width="1"/><line x1="26.0" y1="504.1" x2="34.0" y2="504.1" stroke="#666" stroke-width="1"/><text x="24.0" y="297.0" font-size="11" fill="#666" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke" transform="rotate(-90 24.0 297.0)">79.625"</text><text x="587.1" y="84.0" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke">SECTION A-A  (top view of one leaf)</text><rect x="587.1" y="100.0" width="121.0" height="5.5" fill="#d1d5db" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="587.1" y="144.0" width="121.0" height="5.5" fill="#d1d5db" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="587.1" y="105.5" width="33.0" height="38.5" fill="#e8dcc8" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="675.1" y="105.5" width="33.0" height="38.5" fill="#e8dcc8" stroke="#1b1b1b" stroke-width="1" rx="0"/><text x="647.6" y="128.8" font-size="10" fill="#666" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">R-13</text><text x="718.1" y="103.8" font-size="9" fill="#666" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">1/2" mold-resistant board (storage face)</text><text x="718.1" y="148.4" font-size="9" fill="#666" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">1/2" regular gypsum (room face)</text><text x="587.1" y="165.5" font-size="9" fill="#666" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">Frame 3.5" + two 1/2" skins = 4.5" thick. Doubled stiles shown at each end.</text><text x="587.1" y="240.0" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke">MEETING JOINT - TOP VIEW AT THE LOCK</text><rect x="597.1" y="270.0" width="100.0" height="49.5" fill="#fff" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="701.1" y="270.0" width="100.0" height="49.5" fill="#fff" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="664.1" y="275.5" width="33.0" height="38.5" fill="#e8dcc8" stroke="#1b1b1b" stroke-width="1" rx="0"/><rect x="701.1" y="275.5" width="33.0" height="38.5" fill="#e8dcc8" stroke="#1b1b1b" stroke-width="1" rx="0"/><text x="642.1" y="298.8" font-size="9" fill="#666" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">LEAF A</text><text x="757.1" y="298.8" font-size="9" fill="#666" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">LEAF B</text><rect x="681.1" y="256.0" width="40.0" height="10.0" fill="#0b5cab" stroke="#1b1b1b" stroke-width="1" rx="0"/><text x="701.1" y="252.0" font-size="9" fill="#0b5cab" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">jimmy-proof rim deadbolt body (room face)</text><rect x="697.1" y="323.5" width="8.0" height="6.0" fill="#0b5cab" stroke="#1b1b1b" stroke-width="1" rx="0"/><text x="701.1" y="345.5" font-size="9" fill="#666" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">astragal + EPDM on leaf B edge (storage side); strike through-bolted into B's doubled stile</text><text x="701.1" y="359.5" font-size="9" fill="#666" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">Leaf A opens first, then B. Check that deadbolt, barrel bolts and astragal do not collide on the room face.</text><text x="597.1" y="385.5" font-size="9" fill="#666" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">storage side (bottom)  /  room side (top)</text><text x="30.0" y="584.0" font-size="10" fill="#666" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">Estimated finished weight ~156 lb per leaf (range 135-160 lb) - do not assume 110-130 lb.</text><text x="30.0" y="600.0" font-size="10" fill="#666" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">Build flat: skin storage face first, hang the leaf, then insulate and skin the room face.</text><text x="30.0" y="616.0" font-size="10" fill="#666" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="3" paint-order="stroke">Leaf height depends on the MEASURED ceiling height - see CUTLIST.md formula.</text></svg>